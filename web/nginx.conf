server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pas de routeur côté client dans cette appli (navigation par état React,
    # pas d'URLs distinctes) — un simple fallback suffit, pas de config SPA
    # complexe nécessaire.
    location / {
        try_files $uri /index.html;
    }
}
